schema_version: '1.1'
id: lm_eval_mlu_container
framework:
  adapter: lm_eval
parameters:
  tool_root: /REPLACE_WITH_LM_EVAL_ROOT
  provenance_policy: migration
  require_clean_framework: true
  batch_size: 1
  num_concurrent: 16
  max_retries: 3
  request_timeout: 600
  evaluation_timeout_seconds: 86400
  random_seed: 0
  numpy_random_seed: 1234
  torch_random_seed: 1234
  fewshot_random_seed: 1234
  request_seed: 1234
  pythonhashseed: 1234
  log_samples: false
  metric_maps:
    mmlu:
      acc,none: accuracy
    hellaswag:
      acc_norm,none: accuracy
binding:
  adapter: lm_eval
