schema_version: '1.1'
id: vllm_mlu_container
backend:
  adapter: vllm
management:
  mode: managed
model_location:
  root: /REPLACE_WITH_MODEL_ROOT
  path_template: '{model.source.ref}'
parameters:
  executable: /REPLACE_WITH_VLLM_EXECUTABLE
  port: 8091
  tensor_parallel_size: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.8
  max_num_seqs: 16
  num_concurrent: 16
  ready_timeout_seconds: 900
compatibility:
  runtime_families:
  - neuware
