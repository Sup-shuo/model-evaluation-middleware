schema_version: "1.3"

# Copy this template to config/systems/<machine>.yaml and replace the paths.
system:
  name: example-nvidia-host

metadata:
  timezone: Asia/Shanghai

profiles:
  defaults:
    hardware: nvidia

  environment:
    backend:
      type: current
    evaluator:
      type: venv
      profile: /opt/venvs/lm-eval

  hardware:
    nvidia:
      type: nvidia
      devices: [0]
      runtime:
        type: cuda
        root: /usr/local/cuda

  backend:
    vllm:
      type: vllm
      executable: /usr/local/bin/vllm
      environment: backend
      compatibility:
        runtime_families: [cuda]
      parameters:
        port: 8091
        gpu_memory_utilization: 0.80
        max_num_seqs: 4
        num_concurrent: 4

  evaluator:
    lm_eval:
      type: lm_eval
      root: /opt/lm-evaluation-harness
      environment: evaluator
      parameters:
        provenance_policy: migration
        require_clean_framework: false

models:
  root: /data/models

paths:
  cache: /var/cache/model-evaluation
  results: results
