schema_version: "1.3"

# Full BBH: 24 tasks and 5,761 effective examples. No evaluator.limit.
models: [qwen-example]
benchmarks: [bbh]

backend:
  profile: vllm
  parameters:
    seed: 1234
    pythonhashseed: 1234

evaluator:
  profile: lm_eval
  parameters:
    batch_size: 1
    num_concurrent: 4
    log_samples: true
    random_seed: 0
    numpy_random_seed: 1234
    torch_random_seed: 1234
    fewshot_random_seed: 1234
    request_seed: 1234
    pythonhashseed: 1234
    evaluation_timeout_seconds: 86400
    preflight_timeout_seconds: 600

offline: true

execution:
  mode: serial
  continue_on_error: true
