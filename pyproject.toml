[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-evaluation-middleware"
version = "4.1.0rc1"
description = "Portable glue layer for reproducible model evaluation across hardware and frameworks"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0"]

[project.scripts]
eval-manager = "model_evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model_evaluation*"]
exclude = ["config*", "results*", "scripts*", "tests*", "tools*"]
namespaces = true

[tool.setuptools.package-data]
model_evaluation = [
  "VERSION.txt",
  "schemas/*.json",
  "schemas/user/*.json",
  "examples/*/*.yaml",
  "presets/*/*.yaml",
  "adapters/*/*/adapter",
  "adapters/*/*/*.py",
  "adapters/*/*/*.json",
  "adapters/*/*/*.tsv",
]
