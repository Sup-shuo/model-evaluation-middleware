schema_version: "1.3"
model_catalog: models
models:
  - id: example-vlm
    select_artifact_by_modality: true
    overrides:
      backend:
        language_model_only: false
        max_model_len: 16384
benchmarks: [mmstar]
backend:
  profile: vllm
  parameters: {language_model_only: false, max_model_len: 16384}
evaluator:
  profile: evalscope
  parameters:
    dataset_hub: modelscope
    metric_maps: {mmstar: {mean_acc: accuracy}}
    temperature: 0.0
    seed: 42
    max_tokens: 1024
offline: false
execution: {mode: serial, continue_on_error: false}
